[package]
name = "hax-herdr"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Runs hax and reports its status to Herdr (OSC 7501), without changing hax"
license = "MIT"
repository = "https://github.com/aravindhsampath/hax-herdr"

[dependencies]
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
strip = true
